<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script src="theme-init.js"></script>
<script src="bar.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>SchoolHub</title>
<style>
/* Light and dark: <html data-theme="light|dark"> picks the palette (theme-init.js before the first
   paint, bar.js after). The tokens are QuantPrep's, so the two apps look like one platform. */
:root{
  --bg:#f3f4f6;--surface:#ffffff;--surface-2:#f7f8fa;--surface-3:#eceef2;--surface-raised:#ffffff;
  --border:#dfe2e8;--border-strong:#c9ced7;--border-input:#868c98;
  --text:#111318;--muted:#535966;--faint:#646a76;
  --accent:#2f5bd3;--accent-hover:#2850be;--accent-soft:#e9effd;--on-accent:#ffffff;--ring:rgb(47 91 211 / .22);
  --good:#17764a;--good-soft:#e4f3eb;--bad:#b3362a;--bad-soft:#fbe9e6;--warn:#9a5806;--warn-soft:#fcf0df;
  --shadow-sm:0 1px 2px rgb(16 24 40 / .05);
  --shadow:0 1px 3px rgb(16 24 40 / .06),0 1px 2px rgb(16 24 40 / .04);
  --shadow-md:0 4px 12px rgb(16 24 40 / .08),0 1px 3px rgb(16 24 40 / .06);
  --shadow-lg:0 10px 30px rgb(16 24 40 / .1),0 2px 6px rgb(16 24 40 / .06);
  --scrim:rgb(16 24 40 / .32);
  /* Course dots, in the hues SchoolHub always gave them (blue, red, green, purple, orange, cyan, pink,
     yellow, brown, plum). Each keeps 3:1 on --bg and every surface, any two stay apart (OKLab
     difference above 8), and every course name is written next to its dot, so color is never the
     only cue. Your own tasks are grey. */
  --course-1:#2f6fdf;--course-2:#cf3f36;--course-3:#23895c;--course-4:#8f55cc;--course-5:#c2650a;
  --course-6:#0f8299;--course-7:#c23c7c;--course-8:#8a8400;--course-9:#8a5a2e;--course-10:#8b4b88;--course-personal:#646a76;
  --radius:12px;--radius-sm:8px;
  /* The page column and the app bar match QuantPrep's, so the app switch stays put between apps. */
  --content:1040px;--gutter:24px;--bar-height:56px;
  --font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0d11;--surface:#14171d;--surface-2:#1e232b;--surface-3:#252a33;--surface-raised:#323946;
  --border:#282d37;--border-strong:#373e4a;--border-input:#666e7c;
  --text:#e8eaee;--muted:#a3a9b5;--faint:#8c93a0;
  --accent:#7c9cff;--accent-hover:#93adff;--accent-soft:#1b2440;--on-accent:#0b0d11;--ring:rgb(124 156 255 / .3);
  --good:#4cc38a;--good-soft:#13291f;--bad:#f07a68;--bad-soft:#2d1714;--warn:#e3a24c;--warn-soft:#2b2010;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .5);
  --shadow:0 1px 2px rgb(0 0 0 / .45),0 0 0 1px rgb(255 255 255 / .03);
  --shadow-md:0 6px 16px rgb(0 0 0 / .5),0 0 0 1px rgb(255 255 255 / .04);
  --shadow-lg:0 12px 32px rgb(0 0 0 / .55),0 0 0 1px rgb(255 255 255 / .04);
  --scrim:rgb(0 0 0 / .55);
  --course-1:#5b8ef7;--course-2:#f0706a;--course-3:#3fbf80;--course-4:#b18cf2;--course-5:#ec9440;
  --course-6:#2bb5cc;--course-7:#e874a8;--course-8:#c4bc2a;--course-9:#b9875a;--course-10:#d7a2d5;--course-personal:#8c93a0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar-height) + 16px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font-text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft);color:var(--text)}
/* Set for a moment while the theme changes, so every color switches together. */
:root[data-theme-switching] *,:root[data-theme-switching] *::before,:root[data-theme-switching] *::after{transition:none!important}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* The app bar, laid out like QuantPrep's so the two read as one product: solid on --surface with a
   bottom border, the same height, the title (or the app switch) at the left, SchoolHub's two views
   as its nav, and the theme button at the right end of the page column. */
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:20px;max-width:calc(var(--content) + 2 * var(--gutter));height:var(--bar-height);margin:0 auto;padding:0 var(--gutter)}
.brand-slot{display:flex;align-items:center;flex:none;min-width:0}
.brand{margin:0;font-size:15px;line-height:32px;font-weight:650;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
/* The views, styled as QuantPrep's nav: the one on show sits on a soft pill. */
.views{display:flex;align-items:center;gap:2px;flex:none;min-width:0}
.views button{display:inline-flex;align-items:center;height:32px;padding:0 10px;border:0;border-radius:var(--radius-sm);background:none;color:var(--muted);cursor:pointer;font-size:14px;font-weight:520;white-space:nowrap;transition:background-color 120ms ease,color 120ms ease}
.views button:hover{color:var(--text);background:var(--surface-2)}
.views button[aria-pressed="true"]{color:var(--text);background:var(--surface-3)}
.views button:focus-visible{outline-offset:-2px}
/* The bar's end fills the rest of the row, so what appears in it later (the last sync) moves nothing. */
.bar-end{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex:1;min-width:0;margin-left:auto}
/* Above the lists: search and Show done, which filter them, and the last sync. */
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-bottom:20px}
.toolbar input[type=search]{flex:1 1 220px;max-width:320px;min-width:0}
/* The last sync and Sync now: beside the theme button where the bar has room (bar.js moves it),
   at the end of the toolbar on narrow screens. */
.syncbox{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.sync{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}.sync.stale{color:var(--warn)}
.bar-end .syncbox{gap:2px;margin:0 2px 0 0}
.bar-end .sync{padding:0 8px}
.bar-end #syncBtn{min-height:32px;padding:0 10px;border:0;background:none;box-shadow:none;color:var(--muted);font-size:14px}
.bar-end #syncBtn:hover{color:var(--text);background:var(--surface-2)}
.bar-end #syncBtn:disabled:hover{color:var(--muted);background:none}
label.tog{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none;white-space:nowrap}
/* As tall as Sync now, so the row does not grow when the last sync appears beside it on a phone. */
.toolbar label.tog{min-height:30px}
.theme-btn{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;padding:0;border:0;border-radius:var(--radius-sm);background:none;color:var(--muted);cursor:pointer;transition:background-color 120ms ease,color 120ms ease}
.theme-btn:hover{color:var(--text);background:var(--surface-2)}
.theme-btn svg{width:18px;height:18px}

/* The app switch, when the page is part of a platform: the platform's mark, then QuantPrep | School
   with the app you are in raised. */
.app-switch{display:inline-flex;align-items:center;gap:10px;flex:none}
.brand-mark{width:22px;height:22px;flex:none}
.brand-mark rect{fill:var(--accent)}
.brand-mark path{fill:none;stroke:var(--on-accent)}
.app-seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-3)}
.app-seg a{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:7px;color:var(--muted);font-size:14px;font-weight:520;white-space:nowrap;transition:background-color 120ms ease,color 120ms ease}
.app-seg a:hover{color:var(--text);text-decoration:none}
.app-seg a:focus-visible{outline-offset:0}
.app-seg a[aria-current]{background:var(--surface-raised);color:var(--text);box-shadow:var(--shadow-sm),0 0 0 1px var(--border)}
/* A hairline between the switch (which app) and the views (where in it), as in QuantPrep. */
.app-switch::after{content:"";flex:none;width:1px;height:20px;margin:0 -4px 0 6px;background:var(--border-strong)}
/* QuantPrep's widths: between a phone and 960 px its nav needs the room, so the switch leaves out
   the mark and narrows; below 361 px it leaves out the mark. The same here, so the switch sits in
   the same place in both apps. */
@media (min-width:641px) and (max-width:960px){.app-switch .brand-mark{display:none}.app-seg a{padding:0 9px}}
@media (max-width:360px){.app-switch .brand-mark{display:none}}

/* Controls, as in QuantPrep. */
input[type=search],dialog.task :is(input,select,textarea){padding:0 11px;height:36px;border:1px solid var(--border-input);border-radius:var(--radius-sm);background-color:var(--surface);color:var(--text);width:100%;transition:border-color 120ms ease,box-shadow 120ms ease}
:is(input,select,textarea):focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
input[type=checkbox]{accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);cursor:pointer;font-size:14px;font-weight:520;line-height:1.3;white-space:nowrap;transition:background-color 120ms ease,border-color 120ms ease}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:active{background:var(--surface-3)}
.btn.small{min-height:30px;padding:4px 10px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{opacity:.55;cursor:default}
.btn:disabled:hover{background:var(--surface)}

/* The page column, QuantPrep's, with room at the bottom for the + button. */
.page{display:block;max-width:calc(var(--content) + 2 * var(--gutter));margin:0 auto;padding:32px var(--gutter) 96px}
.banner{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.banner a{font-weight:600}
.errors{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.errors ul{margin:4px 0 0;padding-left:18px}

/* Stats, lists and the course materials sit on panes. */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.stat b{display:block;font:500 24px/1.3 var(--font-num);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.stat.red b{color:var(--bad)}.stat.amber b{color:var(--warn)}
.group{margin-bottom:24px}
.group h2,.sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;font-weight:600}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) auto 150px 104px 28px;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--border);cursor:pointer;font-size:14px;line-height:1.45;transition:background-color 120ms ease}
.row:first-child{border-top:0}.row:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* The name is a button, so the drawer opens from the keyboard too; it reads as text. */
.name{display:block;min-width:0;padding:0;border:0;background:none;color:inherit;font:inherit;font-weight:560;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{color:var(--muted);font-weight:400;margin-left:8px}
.plat{font-size:11.5px;color:var(--muted);border:1px solid var(--border-strong);border-radius:6px;padding:0 7px;line-height:18px;white-space:nowrap}
.due{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
/* Status pills, soft like QuantPrep's state tags. */
.pill{font-size:12px;font-weight:540;line-height:18px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums}
.s-missing,.s-overdue{background:var(--bad-soft);color:var(--bad)}.s-soon,.s-flagged,.s-check{background:var(--warn-soft);color:var(--warn)}
.s-todo{background:var(--surface-3);color:var(--text)}.s-submitted{background:var(--accent-soft);color:var(--accent)}
.s-graded,.s-marked{background:var(--good-soft);color:var(--good)}.s-offline,.s-excused,.s-expired{background:var(--surface-3);color:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-input);background:var(--surface);color:transparent;cursor:pointer;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0;transition:all .15s}
.check:hover{border-color:var(--good);color:var(--good)}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.courses{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
/* A course's own list leaves out the course column: every row is that course. */
.courses .row{grid-template-columns:minmax(0,1fr) auto 150px 104px 28px}
.courses .row .chip{display:none}
.clist{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--bar-height) + 17px);align-self:start;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.clist button{text-align:left;border:0;background:none;color:var(--muted);font-size:14px;font-weight:520;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;display:flex;gap:8px;align-items:center;transition:background-color 120ms ease,color 120ms ease}
.clist button:hover{background:var(--surface-2);color:var(--text)}
.clist button.on{background:var(--surface-3);color:var(--text)}
.clist .n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chead{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.chead h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.015em}
.sub{margin-top:26px}
.mat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 18px;font-size:14px}
details.mod{border-top:1px solid var(--border);padding:9px 0}details.mod:first-child{border-top:0}
details.mod summary{cursor:pointer;font-weight:560}
details.mod ul{margin:6px 0 2px;padding-left:20px}details.mod li{margin:3px 0}

/* The drawer and the task dialog. */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9}
aside{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:10;border-left:1px solid var(--border);overflow:auto;padding:22px 24px 60px;box-shadow:var(--shadow-lg)}
aside:focus{outline:none}
aside h3{margin:6px 40px 8px 0;font-size:20px;font-weight:650;letter-spacing:-.015em}
aside .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
aside h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 6px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:10px}.note.warn{color:var(--warn)}
.files a,.files .offsite{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--border)}
.files a:first-child,.files .offsite:first-child{border-top:0}
.offsite{color:var(--muted)}
.files .sz{margin-left:auto;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.comment{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;margin:6px 0;font-size:13px;white-space:pre-wrap}
.doc{font-size:14.5px;line-height:1.6}
.doc img{max-width:100%;height:auto;border-radius:6px}
.doc p{margin:9px 0}.doc ul,.doc ol{margin:9px 0;padding-left:22px}.doc li{margin:4px 0}
.doc h1,.doc h2,.doc h3,.doc h4{font-size:15px;margin:16px 0 6px;font-weight:650}
.doc a{word-break:break-word}
.doc table{display:block;overflow-x:auto;border-collapse:collapse;margin:10px 0}
.doc td,.doc th{border:1px solid var(--border);padding:6px 9px;text-align:left}
.doc pre{overflow-x:auto;background:var(--surface-2);padding:10px;border-radius:var(--radius-sm)}
.doc iframe,.doc video{max-width:100%}
/* Colored text and highlights in instructions, in the theme's colors (dashboard.js themeColors). */
.doc :is(.hl-yellow,mark){background:var(--warn-soft);color:inherit}
.doc .hl-green{background:var(--good-soft)}.doc .hl-blue{background:var(--accent-soft)}.doc .hl-red{background:var(--bad-soft)}
.doc :is(.hl-yellow,.hl-green,.hl-blue,.hl-red,mark){border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.doc .tc-yellow{color:var(--warn)}.doc .tc-green{color:var(--good)}.doc .tc-blue{color:var(--accent)}.doc .tc-red{color:var(--bad)}
.close{position:absolute;top:14px;right:16px;display:grid;place-items:center;border:0;background:var(--surface-2);color:var(--muted);border-radius:var(--radius-sm);width:32px;height:32px;padding:0;font-size:20px;line-height:1;cursor:pointer;transition:background-color 120ms ease,color 120ms ease}
.close:hover{background:var(--surface-3);color:var(--text)}
.empty{color:var(--muted);padding:40px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:var(--radius);padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;z-index:20;box-shadow:var(--shadow-lg);font-size:13.5px;max-width:calc(100% - 32px);overflow:hidden}
.toast button{border:0;background:var(--bg);color:var(--text);font-weight:650;border-radius:var(--radius-sm);padding:5px 14px;cursor:pointer}
.toast .timer{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.fab{position:fixed;right:28px;bottom:28px;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);
     font:300 30px/1 var(--font-text);display:grid;place-items:center;cursor:pointer;z-index:8;
     box-shadow:var(--shadow-lg);transition:transform .15s,background-color 120ms ease}
.fab:hover{transform:scale(1.06);background:var(--accent-hover)}
dialog.task{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;
            width:min(460px,calc(100% - 32px));box-shadow:var(--shadow-lg)}
dialog.task::backdrop{background:var(--scrim)}
dialog.task form{padding:22px;display:grid;gap:14px}
dialog.task h3{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
dialog.task label{display:grid;gap:6px;font-size:13px;font-weight:520;color:var(--muted)}
dialog.task :is(input,select,textarea){font-size:14.5px;font-weight:400}
dialog.task textarea{height:auto;min-height:80px;padding:8px 11px;resize:vertical}
dialog.task select{appearance:none;padding-right:32px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
dialog.task .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog.task .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* Narrow windows and phones: the lists' rows take two lines. */
@media (max-width:780px){
  .fab{right:16px;bottom:calc(18px + env(safe-area-inset-bottom))}
  dialog.task{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;border-bottom:0}
  dialog.task form{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  dialog.task :is(input,select,textarea){font-size:16px}
  .stats{grid-template-columns:1fr 1fr;gap:12px}.stat{padding:12px}.stat b{font-size:21px}.stat span{font-size:12px}
  .row,.courses .row{grid-template-columns:minmax(0,1fr) auto 32px;grid-template-areas:"name pill check" "chip due check";
       row-gap:3px;column-gap:10px;padding:11px 14px}
  .row .name{grid-area:name;white-space:normal;line-height:1.3}
  .row .pill{grid-area:pill;align-self:start}
  .row .chip{grid-area:chip}
  .row .due{grid-area:due;align-self:end}
  .row .plat{display:none}
  .row .check{grid-area:check;width:32px;height:32px;align-self:center}
  .courses{grid-template-columns:1fr}.clist{position:static;flex-direction:row;flex-wrap:wrap}
  aside{width:100%;padding:18px 16px calc(50px + env(safe-area-inset-bottom))}
  aside h3{font-size:18px}
  .close{width:34px;height:34px}
  .toast{left:12px;right:12px;transform:none;max-width:none;bottom:calc(86px + env(safe-area-inset-bottom))}
}
/* A phone: QuantPrep's two-row bar, the title (or the app switch) and the theme above, the views
   below, then search on a row of its own. */
@media (max-width:640px){
  /* Two rows of 32 px, 4 px apart, with 8 px above and 6 px below, as in QuantPrep. */
  :root{--gutter:16px;--bar-height:82px}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:32px 32px;grid-template-areas:"brand end" "nav nav";
       gap:4px 12px;padding-top:8px;padding-bottom:6px}
  .brand-slot{grid-area:brand}.bar-end{grid-area:end}
  .app-switch::after{display:none}
  /* The first view's text sits under the title, as QuantPrep's nav does. */
  .views{grid-area:nav;margin:0 calc(-1 * var(--gutter));padding:0 calc(var(--gutter) - 10px)}
  .page{padding-top:24px}
  .toolbar{margin-bottom:16px}
  .toolbar input[type=search]{flex:1 0 100%;max-width:none;font-size:16px}
}
</style>
</head>
<body>
<header class="topbar"><div class="bar">
  <div class="brand-slot" id="brand"><h1 class="brand">SchoolHub</h1></div>
  <nav class="views" id="views" aria-label="Views"><button type="button" data-view="upcoming">Upcoming</button><button type="button" data-view="courses">By course</button></nav>
  <div class="bar-end"><div class="syncbox" id="syncbox" hidden><span id="sync" class="sync"></span><button type="button" class="btn small" id="syncBtn" hidden>Sync now</button></div><button type="button" class="theme-btn" id="themeBtn" aria-label="Theme"></button></div>
</div></header>
<main class="page">
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search assignments…" aria-label="Search assignments">
    <label class="tog"><input type="checkbox" id="showDone"> Show done</label>
  </div>
  <div id="main"></div>
</main>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1" hidden></aside>
<button class="fab" id="fab" hidden aria-label="Add a task" title="Add a task (N)">+</button>
<dialog class="task" id="taskDialog">
  <form id="taskForm" autocomplete="off">
    <h3 id="taskHeading">New task</h3>
    <label>Task<input id="tName" maxlength="200" placeholder="e.g. Start the CGA draft" required></label>
    <label>Course<select id="tCourse"></select></label>
    <div class="two">
      <label>Due date<input id="tDate" type="date"></label>
      <label>Time (optional)<input id="tTime" type="time"></label>
    </div>
    <label>Notes<textarea id="tNotes" maxlength="5000" placeholder="Optional"></textarea></label>
    <div class="buttons"><button type="button" class="btn" id="taskCancel">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
